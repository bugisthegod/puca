name: Clean up merged data branch

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'bot/nta-data-') &&
      contains(github.event.pull_request.body, 'Generated by `.github/workflows/prepare-data-update.yml`.') &&
      !contains(github.event.pull_request.labels.*.name, 'keep-branch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use only event metadata; never check out or execute PR code here.
      - name: Delete the merged data branch
        uses: actions/github-script@v8
        with:
          retries: 2
          script: |
            const pr = context.payload.pull_request;
            const ref = `heads/${pr.head.ref}`;
            let branch;
            try {
              const response = await github.rest.git.getRef({
                ...context.repo, ref, request: { timeout: 15000 },
              });
              branch = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Branch already deleted; nothing to do.');
              return;
            }

            // Preserve a branch that received new commits after this PR merged.
            if (branch.object.sha !== pr.head.sha) {
              core.info('Branch has changed since merge; preserving it.');
              return;
            }

            await github.rest.git.deleteRef({
              ...context.repo, ref, request: { timeout: 15000 },
            });
            core.info(`Deleted ${pr.head.ref} after merging #${pr.number}.`);
