name: Prepare data update PR

on:
  schedule:
    - cron: "00 0 * * *" 
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: data-update
  cancel-in-progress: false

env:
  FEED_INFO_FILE: .github/data/feed_info.txt
  NTA_ZIP_URL: https://www.transportforireland.ie/transitData/Data/GTFS_Realtime.zip

jobs:
  prepare:
    name: Generate JSON, open PR, and enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Keep PAT-backed bot pushes from falling back to GITHUB_TOKEN.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Download latest NTA GTFS
        run: |
          mkdir -p gtfs
          curl -fL \
            --retry 5 \
            --retry-delay 15 \
            "${NTA_ZIP_URL}?_=$(date +%s)" \
            -o /tmp/GTFS_Realtime.zip
          unzip -q -o /tmp/GTFS_Realtime.zip -d gtfs
          python3 - <<'PY'
          from pathlib import Path

          required = ("routes.txt", "trips.txt", "stop_times.txt", "shapes.txt", "stops.txt", "feed_info.txt")
          missing = [name for name in required if not (Path("gtfs") / name).exists()]
          if missing:
              raise SystemExit(f"Missing GTFS files: {', '.join(missing)}")

          print((Path("gtfs") / "feed_info.txt").read_text(encoding="utf-8-sig"))
          PY
          cp gtfs/feed_info.txt /tmp/feed_info.txt

      - name: Check feed version
        id: feed
        run: python3 scripts/schedule_artifacts.py compare >> "$GITHUB_OUTPUT"

      - name: Generate JSON data
        if: steps.feed.outputs.changed == 'true'
        run: bun run json:generate

      - name: Update feed marker
        if: steps.feed.outputs.changed == 'true'
        run: |
          mkdir -p "$(dirname "$FEED_INFO_FILE")"
          cp /tmp/feed_info.txt "$FEED_INFO_FILE"

      - name: Find existing archives
        id: archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SOURCE_NAME="nta-gtfs-${{ steps.feed.outputs.uuid }}"
          SCHEDULE_NAME=$(python3 scripts/schedule_artifacts.py name)
          echo "schedule_name=$SCHEDULE_NAME" >> "$GITHUB_OUTPUT"
          for KIND in source schedules; do
            if [ "$KIND" = source ]; then NAME="$SOURCE_NAME"; else NAME="$SCHEDULE_NAME"; fi
            ID=$(gh api --method GET "repos/${GH_REPO}/actions/artifacts" -f name="$NAME" --jq '[.artifacts[] | select(.expired == false)] | first | .id // empty')
            if [ -z "$ID" ]; then MISSING=true; else MISSING=false; fi
            echo "${KIND}_missing=$MISSING" >> "$GITHUB_OUTPUT"
          done

      - name: Archive GTFS source (including unchanged feeds)
        if: steps.archives.outputs.source_missing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nta-gtfs-${{ steps.feed.outputs.uuid }}
          path: /tmp/GTFS_Realtime.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Generate and check schedule DBs before opening PR
        if: steps.archives.outputs.schedules_missing == 'true'
        run: |
          python3 scripts/verify_schedule_feed.py
          bun run db:generate
          python3 scripts/schedule_artifacts.py pack

      - name: Archive verified schedule DBs
        if: steps.archives.outputs.schedules_missing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archives.outputs.schedule_name }}
          path: /tmp/nta-schedules/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Verify archived DBs match this PR
        uses: ./.github/actions/prepare-schedule-dbs

      - name: Open data update PR
        id: pr
        if: steps.feed.outputs.changed == 'true'
        env:
          DATA_UPDATE_TOKEN: ${{ secrets.DATA_UPDATE_TOKEN }}
          GH_TOKEN: ${{ secrets.DATA_UPDATE_TOKEN }}
        run: |
          if git diff --quiet -- src/data "$FEED_INFO_FILE"; then
            echo "No tracked JSON or feed marker changes after generation."
            exit 0
          fi

          if [ -z "${DATA_UPDATE_TOKEN:-}" ]; then
            echo "::error::DATA_UPDATE_TOKEN is required so bot PR pushes trigger required checks. Add a repo secret with contents and pull request write access."
            exit 1
          fi

          BRANCH="bot/nta-data-${{ steps.feed.outputs.uuid }}"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "url=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            echo "Existing data PR found; archives are ready. Update that branch with current main before merging."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "$BRANCH"
          git add src/data "$FEED_INFO_FILE"
          git commit -m "chore(data): NTA feed ${{ steps.feed.outputs.feed_start }}"
          git push origin "$BRANCH"

          BODY="$(cat <<'BODY'
          NTA published a new static GTFS zip. This PR updates the GTFS-derived JSON files and the tracked feed marker from the latest full zip.

          | field | value |
          |---|---|
          | `feed_start_date` | `${{ steps.feed.outputs.feed_start }}` |
          | `feed_end_date` | `${{ steps.feed.outputs.feed_end }}` |
          | new `feed_version` UUID | `${{ steps.feed.outputs.uuid }}` |
          | previous `feed_start_date` | `${{ steps.feed.outputs.ack_feed_start }}` |
          | previous `feed_end_date` | `${{ steps.feed.outputs.ack_feed_end }}` |
          | previous UUID | `${{ steps.feed.outputs.ack_uuid }}` |

          Source: <${{ env.NTA_ZIP_URL }}>

          ## Included

          - Updated `src/data/*.json` generated with `bun run json:generate`
          - Updated `.github/data/feed_info.txt`

          ## Follow-up

          Schedule DBs have been generated, integrity-checked, and archived before this PR is opened. Required checks verify the archived DBs match this PR. After merge, deployment restores those verified DBs, deploys the app, then uploads matching DBs. Ordinary code deployments do not replace DBs. Production DBs are never changed by PR preparation.

          Generated by `.github/workflows/prepare-data-update.yml`.
          BODY
          )"

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update NTA static data (${{ steps.feed.outputs.feed_start }})" \
            --body "$BODY")"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Enable PR auto-merge
        if: steps.feed.outputs.changed == 'true' && steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.DATA_UPDATE_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.url }}" --squash --auto --delete-branch
