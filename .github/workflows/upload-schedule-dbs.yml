name: Repair schedule deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    # Reuse the full release: uploading DBs alone could mismatch a failed or
    # superseded app deployment. The called deploy job holds the shared lock.
    uses: ./.github/workflows/fly-deploy.yml
    with:
      replace_schedules: true
    secrets: inherit
