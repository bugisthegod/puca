name: Test

permissions:
  contents: read
  actions: read

on:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check
      - name: Verify pre-merge schedule artifact for data PRs
        if: startsWith(github.ref, 'refs/heads/bot/nta-data-')
        uses: ./.github/actions/prepare-schedule-dbs
